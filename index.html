<script>
// Vigilante del arranque: si el juego no empieza en 10 s o falla al cargar, en vez de quedarse la pantalla en negro
// se explica qué pasa y se ofrece borrar solo la caché del juego (las partidas guardadas no se tocan) y recargar.
window.__bootErr = [];
window.addEventListener('error', function (e) { if (!window.__booted) { window.__bootErr.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ')' : '')); bootProblem(); } });
window.addEventListener('unhandledrejection', function (e) { if (!window.__booted) { window.__bootErr.push(String((e.reason && e.reason.message) || e.reason || 'error')); bootProblem(); } });
setTimeout(function () { if (!window.__booted) bootProblem(); }, 10000);
function bootProblem() {
  var ld = document.getElementById('loading'); if (!ld || ld.dataset.problem) return; ld.dataset.problem = '1';
  ld.innerHTML = 'EL JUEGO NO HA PODIDO ARRANCAR<br><small style="font-size:12px;color:#c8a070;letter-spacing:1px">' + (window.__bootErr.slice(0, 3).join('<br>') || 'Tarda demasiado en cargar') + '</small><br><button id="bootfix" style="margin-top:14px;font:bold 15px monospace;padding:10px 16px;background:#3a1a0c;color:#e8b850;border:1px solid #e8b850">BORRAR CACHÉ Y RECARGAR</button><br><small style="font-size:11px;color:#8a7050">Tus partidas no se borran</small>';
  ld.style.flexDirection = 'column'; ld.style.zIndex = 9;
  document.getElementById('bootfix').onclick = function () {
    var p = [];
    if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
    if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
    Promise.all(p).catch(function () {}).then(function () { location.replace(location.pathname + '?r=' + Date.now()); });
  };
}
